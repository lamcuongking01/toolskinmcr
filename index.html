<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Generator Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: #2a2a2a; border: 1px solid #444; padding: 20px; border-radius: 8px; }
        h2 { color: #00ff88; margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        textarea { width: 100%; height: 100px; background: #111; color: #e0e0e0; border: 1px solid #555; padding: 10px; font-family: inherit; font-size: 14px; resize: vertical; }
        .btn { background: #00cc77; color: #000; border: none; padding: 10px 24px; font-weight: bold; cursor: pointer; border-radius: 4px; margin: 10px 5px 10px 0; font-family: inherit; }
        .btn:hover { background: #00ff99; }
        .btn-danger { background: #cc4444; color: #fff; }
        .btn-danger:hover { background: #ff5555; }
        canvas { width: 100%; height: auto; border: 2px solid #444; background: #333; image-rendering: pixelated; }
        .history-list { max-height: 400px; overflow-y: auto; }
        .history-item { background: #1f1f1f; padding: 8px 12px; margin: 4px 0; border-left: 3px solid #00cc77; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background: #2f2f2f; }
        .history-item .timestamp { color: #888; font-size: 11px; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .controls input, .controls select { background: #111; color: #e0e0e0; border: 1px solid #555; padding: 6px 10px; font-family: inherit; }
        .controls label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .clear-history { margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Left: Input + Canvas -->
    <div class="panel">
        <h2>▶ REQUEST</h2>
        <textarea id="requestInput" placeholder="Describe skin (e.g. 'red gradient with stripes and high detail')">red gradient with stripes high detail</textarea>
        <div class="controls">
            <label>Primary: <input type="color" id="colorPrimary" value="#ff0000"></label>
            <label>Secondary: <input type="color" id="colorSecondary" value="#0000ff"></label>
            <label>Pattern: 
                <select id="patternSelect">
                    <option value="solid">Solid</option>
                    <option value="gradient" selected>Gradient</option>
                    <option value="stripes">Stripes</option>
                    <option value="checker">Checker</option>
                    <option value="camouflage">Camouflage</option>
                    <option value="marble">Marble</option>
                </select>
            </label>
            <label>Detail: 
                <select id="detailSelect">
                    <option value="1">Low</option>
                    <option value="2" selected>Medium</option>
                    <option value="3">High</option>
                </select>
            </label>
        </div>
        <button class="btn" id="generateBtn">▶ GENERATE</button>
        <button class="btn btn-danger" id="clearCanvasBtn">✕ CLEAR</button>
        <hr style="border-color: #444; margin: 15px 0;">
        <h2>▶ PREVIEW</h2>
        <canvas id="skinCanvas" width="512" height="512"></canvas>
        <div style="margin-top: 10px;">
            <button class="btn" id="downloadBtn">⬇ DOWNLOAD PNG</button>
        </div>
    </div>

    <!-- Right: History -->
    <div class="panel">
        <h2>▶ HISTORY</h2>
        <div class="history-list" id="historyList">
            <div style="color: #666; text-align: center; padding: 20px;">No entries yet</div>
        </div>
        <button class="btn btn-danger clear-history" id="clearHistoryBtn">✕ CLEAR ALL HISTORY</button>
    </div>
</div>

<script>
// ============================================================
// SKIN GENERATOR ENGINE
// ============================================================
const canvas = document.getElementById('skinCanvas');
const ctx = canvas.getContext('2d');
const width = 512, height = 512;

// Color helpers
function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return { r, g, b };
}
function rgbToHex(r,g,b) {
    return '#' + [r,g,b].map(c => Math.min(255, Math.max(0, Math.round(c))).toString(16).padStart(2,'0')).join('');
}
function clamp(v) { return Math.min(255, Math.max(0, Math.round(v))); }

// Main generator
function generateSkin(params) {
    const primary = params.primary || '#ff0000';
    const secondary = params.secondary || '#0000ff';
    const pattern = params.pattern || 'gradient';
    const detail = parseInt(params.detail) || 2;

    const pRgb = hexToRgb(primary);
    const sRgb = hexToRgb(secondary);
    const imgData = ctx.createImageData(width, height);
    const data = imgData.data;

    // Fill base color
    for (let i = 0; i < data.length; i += 4) {
        data[i] = pRgb.r;
        data[i+1] = pRgb.g;
        data[i+2] = pRgb.b;
        data[i+3] = 255;
    }

    // Pattern application
    switch(pattern) {
        case 'solid':
            break;
        case 'gradient':
            for (let y = 0; y < height; y++) {
                const ratio = y / height;
                const r = clamp(pRgb.r * (1 - ratio) + sRgb.r * ratio);
                const g = clamp(pRgb.g * (1 - ratio) + sRgb.g * ratio);
                const b = clamp(pRgb.b * (1 - ratio) + sRgb.b * ratio);
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    data[idx] = r;
                    data[idx+1] = g;
                    data[idx+2] = b;
                }
            }
            break;
        case 'stripes': {
            const stripeW = 20;
            for (let y = 0; y < height; y++) {
                if (Math.floor(y / stripeW) % 2 === 0) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * width + x) * 4;
                        data[idx] = sRgb.r;
                        data[idx+1] = sRgb.g;
                        data[idx+2] = sRgb.b;
                    }
                }
            }
            break;
        }
        case 'checker': {
            const size = 40;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if ((Math.floor(x/size) + Math.floor(y/size)) % 2 === 0) {
                        const idx = (y * width + x) * 4;
                        data[idx] = sRgb.r;
                        data[idx+1] = sRgb.g;
                        data[idx+2] = sRgb.b;
                    }
                }
            }
            break;
        }
        case 'camouflage': {
            for (let i = 0; i < 80; i++) {
                const cx = Math.floor(Math.random() * width);
                const cy = Math.floor(Math.random() * height);
                const radius = 10 + Math.floor(Math.random() * 35);
                const cr = 50 + Math.floor(Math.random() * 200);
                const cg = 50 + Math.floor(Math.random() * 200);
                const cb = 50 + Math.floor(Math.random() * 200);
                for (let y = Math.max(0, cy-radius); y < Math.min(height, cy+radius); y++) {
                    for (let x = Math.max(0, cx-radius); x < Math.min(width, cx+radius); x++) {
                        const dx = x - cx, dy = y - cy;
                        if (dx*dx + dy*dy <= radius*radius) {
                            const idx = (y * width + x) * 4;
                            data[idx] = cr;
                            data[idx+1] = cg;
                            data[idx+2] = cb;
                        }
                    }
                }
            }
            break;
        }
        case 'marble': {
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const val = 128 + 127 * Math.sin(x/30 + y/20 + Math.random() * 0.3);
                    const idx = (y * width + x) * 4;
                    const mix = val / 255;
                    data[idx] = clamp(pRgb.r * (1 - mix) + sRgb.r * mix);
                    data[idx+1] = clamp(pRgb.g * (1 - mix) + sRgb.g * mix);
                    data[idx+2] = clamp(pRgb.b * (1 - mix) + sRgb.b * mix);
                }
            }
            break;
        }
        default: break;
    }

    // Details
    if (detail >= 2) {
        // Grid lines
        for (let i = 0; i <= width; i += 64) {
            for (let y = 0; y < height; y++) {
                const idx1 = (y * width + i) * 4;
                if (i < width) { data[idx1] = 0; data[idx1+1] = 0; data[idx1+2] = 0; }
                const idx2 = (i * width + y) * 4;
                if (i < height) { data[idx2] = 0; data[idx2+1] = 0; data[idx2+2] = 0; }
            }
        }
    }
    if (detail >= 3) {
        // High details - circles
        for (let i = 0; i < 8; i++) {
            const cx = 40 + i * 60;
            const cy = 40 + i * 60;
            const radius = 15;
            for (let y = Math.max(0, cy-radius); y < Math.min(height, cy+radius); y++) {
                for (let x = Math.max(0, cx-radius); x < Math.min(width, cx+radius); x++) {
                    const dx = x - cx, dy = y - cy;
                    if (Math.abs(dx*dx + dy*dy - radius*radius) < 20) {
                        const idx = (y * width + x) * 4;
                        data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255;
                    }
                }
            }
        }
    }

    ctx.putImageData(imgData, 0, 0);
}

// ============================================================
// UI CONTROLS & HISTORY
// ============================================================
let history = JSON.parse(localStorage.getItem('skinHistory') || '[]');

function renderHistory() {
    const list = document.getElementById('historyList');
    if (history.length === 0) {
        list.innerHTML = '<div style="color: #666; text-align: center; padding: 20px;">No entries yet</div>';
        return;
    }
    list.innerHTML = history.map((item, index) => `
        <div class="history-item" data-index="${index}">
            <span>${item.request.substring(0, 60)}${item.request.length > 60 ? '...' : ''}</span>
            <span class="timestamp">${item.timestamp}</span>
            <button class="btn" style="padding: 2px 8px; font-size: 11px; margin:0;" data-restore="${index}">↺</button>
        </div>
    `).join('');

    // Restore click
    list.querySelectorAll('[data-restore]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.restore);
            const item = history[idx];
            if (item) {
                document.getElementById('requestInput').value = item.request;
                document.getElementById('colorPrimary').value = item.primary;
                document.getElementById('colorSecondary').value = item.secondary;
                document.getElementById('patternSelect').value = item.pattern;
                document.getElementById('detailSelect').value = item.detail;
                generateFromUI();
            }
        });
    });
}

function addHistory(request, primary, secondary, pattern, detail) {
    const entry = {
        request,
        primary,
        secondary,
        pattern,
        detail,
        timestamp: new Date().toLocaleString()
    };
    history.unshift(entry);
    if (history.length > 50) history = history.slice(0, 50);
    localStorage.setItem('skinHistory', JSON.stringify(history));
    renderHistory();
}

function generateFromUI() {
    const request = document.getElementById('requestInput').value || 'default skin';
    const primary = document.getElementById('colorPrimary').value;
    const secondary = document.getElementById('colorSecondary').value;
    const pattern = document.getElementById('patternSelect').value;
    const detail = document.getElementById('detailSelect').value;

    generateSkin({ primary, secondary, pattern, detail });
    addHistory(request, primary, secondary, pattern, detail);
}

// ============================================================
// EVENT BINDINGS
// ============================================================
document.getElementById('generateBtn').addEventListener('click', generateFromUI);

document.getElementById('clearCanvasBtn').addEventListener('click', () => {
    ctx.fillStyle = '#333';
    ctx.fillRect(0, 0, width, height);
});

document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    if (confirm('Clear all history?')) {
        history = [];
        localStorage.removeItem('skinHistory');
        renderHistory();
    }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `skin_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
});

// Auto-generate on load with default
window.addEventListener('load', () => {
    renderHistory();
    generateFromUI();
});

// Allow Enter key in textarea to trigger generate
document.getElementById('requestInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateFromUI();
    }
});
</script>
</body>
</html>
