<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Vẽ Skin Theo Yêu Cầu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d0d; color: #e0e0e0; overflow-x: hidden; }
        
        /* HEADER */
        .header { background: #1a1a1a; padding: 12px 24px; display: flex; align-items: center; border-bottom: 2px solid #00cc77; position: sticky; top: 0; z-index: 100; }
        .hamburger { font-size: 28px; cursor: pointer; color: #00cc77; padding: 4px 12px; user-select: none; transition: 0.2s; }
        .hamburger:hover { color: #00ff99; }
        .header-title { font-size: 22px; font-weight: bold; color: #00cc77; margin-left: 16px; letter-spacing: 1px; }
        .header-title span { color: #fff; font-weight: normal; font-size: 14px; margin-left: 12px; }

        /* SIDEBAR MENU */
        .sidebar { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: #1a1a1a; border-right: 2px solid #00cc77; padding: 70px 20px 20px; transition: 0.3s; z-index: 200; overflow-y: auto; }
        .sidebar.open { left: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 150; display: none; }
        .sidebar-overlay.open { display: block; }
        .sidebar h3 { color: #00cc77; margin: 18px 0 10px; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 6px; }
        .sidebar a { display: block; color: #ccc; padding: 10px 14px; text-decoration: none; border-radius: 4px; margin: 2px 0; font-size: 15px; transition: 0.2s; }
        .sidebar a:hover { background: #00cc77; color: #000; }
        .sidebar .close-btn { position: absolute; top: 16px; right: 20px; font-size: 30px; cursor: pointer; color: #cc4444; }
        .sidebar .close-btn:hover { color: #ff6666; }

        /* MAIN LAYOUT - FULL WIDTH */
        .main { display: flex; flex-direction: row; gap: 20px; padding: 20px; max-width: 100%; width: 100%; min-height: calc(100vh - 80px); }
        
        /* LEFT PANEL - REQUEST */
        .panel-left { flex: 1.2; min-width: 300px; background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 20px; }
        .panel-left h2 { color: #00cc77; font-size: 18px; margin-bottom: 14px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
        .panel-left textarea { width: 100%; height: 90px; background: #0d0d0d; color: #e0e0e0; border: 1px solid #333; padding: 10px; font-size: 14px; border-radius: 6px; resize: vertical; font-family: inherit; }
        .panel-left textarea:focus { border-color: #00cc77; outline: none; }
        
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
        .control-group label { display: block; font-size: 12px; color: #888; margin-bottom: 3px; }
        .control-group input[type="color"] { width: 100%; height: 40px; border: none; background: transparent; cursor: pointer; padding: 0; }
        .control-group select { width: 100%; padding: 8px; background: #0d0d0d; color: #e0e0e0; border: 1px solid #333; border-radius: 4px; font-family: inherit; }
        .control-group select:focus { border-color: #00cc77; outline: none; }

        .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
        .btn { background: #00cc77; color: #000; border: none; padding: 10px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; font-family: inherit; }
        .btn:hover { background: #00ff99; transform: scale(1.02); }
        .btn-danger { background: #cc4444; color: #fff; }
        .btn-danger:hover { background: #ff5555; }
        .btn-secondary { background: #333; color: #e0e0e0; }
        .btn-secondary:hover { background: #555; }

        /* CENTER - CANVAS */
        .panel-center { flex: 2; min-width: 400px; background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .panel-center h2 { color: #00cc77; font-size: 18px; margin-bottom: 14px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; width: 100%; text-align: center; }
        .panel-center canvas { width: 100%; max-width: 600px; height: auto; aspect-ratio: 1/1; border: 2px solid #2a2a2a; border-radius: 8px; background: #222; image-rendering: pixelated; }
        .canvas-actions { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }

        /* RIGHT - HISTORY */
        .panel-right { flex: 1; min-width: 250px; background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 20px; }
        .panel-right h2 { color: #00cc77; font-size: 18px; margin-bottom: 14px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .history-list { max-height: 500px; overflow-y: auto; }
        .history-item { background: #1a1a1a; padding: 10px 14px; margin: 4px 0; border-left: 3px solid #00cc77; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .history-item:hover { background: #252525; }
        .history-item .req-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
        .history-item .timestamp { color: #666; font-size: 11px; white-space: nowrap; }
        .history-item .restore-btn { background: #00cc77; color: #000; border: none; padding: 2px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .history-item .restore-btn:hover { background: #00ff99; }
        .empty-history { color: #555; text-align: center; padding: 30px 0; font-style: italic; }

        /* RESPONSIVE */
        @media (max-width: 1024px) { .main { flex-direction: column; } .panel-center canvas { max-width: 100%; } .panel-right { min-width: unset; } }
        @media (max-width: 600px) { .control-grid { grid-template-columns: 1fr; } .header-title { font-size: 16px; } .header-title span { display: none; } }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="hamburger" id="hamburgerBtn">☰</div>
    <div class="header-title">CÔNG CỤ VẼ SKIN <span>— theo yêu cầu, chỉnh sửa, lịch sử</span></div>
</div>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR MENU -->
<div class="sidebar" id="sidebar">
    <div class="close-btn" id="sidebarClose">✕</div>
    <h3>📋 MENU CHÍNH</h3>
    <a href="#" onclick="scrollToPanel('panel-left')">📝 YÊU CẦU</a>
    <a href="#" onclick="scrollToPanel('panel-center')">🎨 BẢN VẼ</a>
    <a href="#" onclick="scrollToPanel('panel-right')">📜 LỊCH SỬ</a>
    <h3>⚙️ TÙY CHỌN</h3>
    <a href="#" onclick="resetAll()">🔄 ĐẶT LẠI MẶC ĐỊNH</a>
    <a href="#" onclick="exportAllHistory()">💾 XUẤT LỊCH SỬ (JSON)</a>
    <a href="#" onclick="importHistory()">📂 NHẬP LỊCH SỬ</a>
    <h3>ℹ️ THÔNG TIN</h3>
    <a href="#" style="color:#666; font-size:13px;">Phiên bản 2.0 | Full HD</a>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- LEFT: REQUEST -->
    <div class="panel-left" id="panel-left">
        <h2>📝 YÊU CẦU VẼ SKIN</h2>
        <textarea id="requestInput" placeholder="Nhập mô tả skin mong muốn... (ví dụ: gradient đỏ-xanh, sọc, chi tiết cao)">gradient đỏ-xanh với sọc và chi tiết cao</textarea>
        
        <div class="control-grid">
            <div class="control-group">
                <label>🎨 MÀU CHÍNH</label>
                <input type="color" id="colorPrimary" value="#ff2200">
            </div>
            <div class="control-group">
                <label>🎨 MÀU PHỤ</label>
                <input type="color" id="colorSecondary" value="#0044ff">
            </div>
            <div class="control-group">
                <label>🔲 HOA VĂN</label>
                <select id="patternSelect">
                    <option value="solid">Đồng nhất</option>
                    <option value="gradient" selected>Chuyển màu</option>
                    <option value="stripes">Sọc</option>
                    <option value="checker">Bàn cờ</option>
                    <option value="camouflage">Ngụy trang</option>
                    <option value="marble">Đá cẩm thạch</option>
                </select>
            </div>
            <div class="control-group">
                <label>🔍 CHI TIẾT</label>
                <select id="detailSelect">
                    <option value="1">Thấp</option>
                    <option value="2" selected>Trung bình</option>
                    <option value="3">Cao</option>
                </select>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn" id="generateBtn">▶ TẠO SKIN</button>
            <button class="btn btn-secondary" id="clearCanvasBtn">✕ XÓA VẼ</button>
        </div>
    </div>

    <!-- CENTER: CANVAS -->
    <div class="panel-center" id="panel-center">
        <h2>🎨 BẢN VẼ SKIN</h2>
        <canvas id="skinCanvas" width="512" height="512"></canvas>
        <div class="canvas-actions">
            <button class="btn" id="downloadBtn">⬇ TẢI PNG</button>
            <button class="btn btn-secondary" id="zoomInBtn">🔍 +</button>
            <button class="btn btn-secondary" id="zoomOutBtn">🔍 −</button>
        </div>
    </div>

    <!-- RIGHT: HISTORY -->
    <div class="panel-right" id="panel-right">
        <h2>📜 LỊCH SỬ <span style="font-size:13px; color:#888;" id="historyCount">(0)</span></h2>
        <div class="history-list" id="historyList">
            <div class="empty-history">Chưa có mục nào</div>
        </div>
        <div class="btn-row" style="margin-top:12px;">
            <button class="btn btn-danger" id="clearHistoryBtn">🗑 XÓA TẤT CẢ</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// SKIN GENERATOR ENGINE
// ============================================================
const canvas = document.getElementById('skinCanvas');
const ctx = canvas.getContext('2d');
const W = 512, H = 512;

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return { r, g, b };
}
function clamp(v) { return Math.min(255, Math.max(0, Math.round(v))); }

function generateSkin(params) {
    const primary = params.primary || '#ff2200';
    const secondary = params.secondary || '#0044ff';
    const pattern = params.pattern || 'gradient';
    const detail = parseInt(params.detail) || 2;

    const pRgb = hexToRgb(primary);
    const sRgb = hexToRgb(secondary);
    const imgData = ctx.createImageData(W, H);
    const data = imgData.data;

    // Base fill
    for (let i = 0; i < data.length; i += 4) {
        data[i] = pRgb.r;
        data[i+1] = pRgb.g;
        data[i+2] = pRgb.b;
        data[i+3] = 255;
    }

    switch(pattern) {
        case 'solid': break;
        case 'gradient':
            for (let y = 0; y < H; y++) {
                const ratio = y / H;
                const r = clamp(pRgb.r * (1 - ratio) + sRgb.r * ratio);
                const g = clamp(pRgb.g * (1 - ratio) + sRgb.g * ratio);
                const b = clamp(pRgb.b * (1 - ratio) + sRgb.b * ratio);
                for (let x = 0; x < W; x++) {
                    const idx = (y * W + x) * 4;
                    data[idx] = r; data[idx+1] = g; data[idx+2] = b;
                }
            }
            break;
        case 'stripes': {
            const sw = 20;
            for (let y = 0; y < H; y++) {
                if (Math.floor(y / sw) % 2 === 0) {
                    for (let x = 0; x < W; x++) {
                        const idx = (y * W + x) * 4;
                        data[idx] = sRgb.r; data[idx+1] = sRgb.g; data[idx+2] = sRgb.b;
                    }
                }
            }
            break;
        }
        case 'checker': {
            const sz = 40;
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    if ((Math.floor(x/sz) + Math.floor(y/sz)) % 2 === 0) {
                        const idx = (y * W + x) * 4;
                        data[idx] = sRgb.r; data[idx+1] = sRgb.g; data[idx+2] = sRgb.b;
                    }
                }
            }
            break;
        }
        case 'camouflage': {
            for (let i = 0; i < 80; i++) {
                const cx = Math.floor(Math.random() * W);
                const cy = Math.floor(Math.random() * H);
                const rad = 10 + Math.floor(Math.random() * 35);
                const cr = 50 + Math.floor(Math.random() * 200);
                const cg = 50 + Math.floor(Math.random() * 200);
                const cb = 50 + Math.floor(Math.random() * 200);
                for (let y = Math.max(0, cy-rad); y < Math.min(H, cy+rad); y++) {
                    for (let x = Math.max(0, cx-rad); x < Math.min(W, cx+rad); x++) {
                        const dx = x - cx, dy = y - cy;
                        if (dx*dx + dy*dy <= rad*rad) {
                            const idx = (y * W + x) * 4;
                            data[idx] = cr; data[idx+1] = cg; data[idx+2] = cb;
                        }
                    }
                }
            }
            break;
        }
        case 'marble': {
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const val = 128 + 127 * Math.sin(x/30 + y/20 + Math.random() * 0.3);
                    const mix = val / 255;
                    const idx = (y * W + x) * 4;
                    data[idx] = clamp(pRgb.r * (1 - mix) + sRgb.r * mix);
                    data[idx+1] = clamp(pRgb.g * (1 - mix) + sRgb.g * mix);
                    data[idx+2] = clamp(pRgb.b * (1 - mix) + sRgb.b * mix);
                }
            }
            break;
        }
        default: break;
    }

    // Details
    if (detail >= 2) {
        for (let i = 0; i <= W; i += 64) {
            for (let y = 0; y < H; y++) {
                if (i < W) { const idx = (y * W + i) * 4; data[idx]=0; data[idx+1]=0; data[idx+2]=0; }
                if (i < H) { const idx = (i * W + y) * 4; data[idx]=0; data[idx+1]=0; data[idx+2]=0; }
            }
        }
    }
    if (detail >= 3) {
        for (let i = 0; i < 8; i++) {
            const cx = 40 + i * 60, cy = 40 + i * 60, rad = 15;
            for (let y = Math.max(0, cy-rad); y < Math.min(H, cy+rad); y++) {
                for (let x = Math.max(0, cx-rad); x < Math.min(W, cx+rad); x++) {
                    const dx = x - cx, dy = y - cy;
                    if (Math.abs(dx*dx + dy*dy - rad*rad) < 20) {
                        const idx = (y * W + x) * 4;
                        data[idx]=255; data[idx+1]=255; data[idx+2]=255;
                    }
                }
            }
        }
    }

    ctx.putImageData(imgData, 0, 0);
}

// ============================================================
// HISTORY MANAGEMENT
// ============================================================
let history = JSON.parse(localStorage.getItem('skinHistory') || '[]');

function renderHistory() {
    const list = document.getElementById('historyList');
    const count = document.getElementById('historyCount');
    count.textContent = `(${history.length})`;
    if (history.length === 0) {
        list.innerHTML = '<div class="empty-history">Chưa có mục nào</div>';
        return;
    }
    list.innerHTML = history.map((item, idx) => `
        <div class="history-item" data-index="${idx}">
            <span class="req-text" title="${item.request}">${item.request.substring(0, 50)}${item.request.length > 50 ? '…' : ''}</span>
            <span class="timestamp">${item.timestamp}</span>
            <button class="restore-btn" data-restore="${idx}">↺</button>
        </div>
    `).join('');

    list.querySelectorAll('[data-restore]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.restore);
            const item = history[idx];
            if (item) {
                document.getElementById('requestInput').value = item.request;
                document.getElementById('colorPrimary').value = item.primary;
                document.getElementById('colorSecondary').value = item.secondary;
                document.getElementById('patternSelect').value = item.pattern;
                document.getElementById('detailSelect').value = item.detail;
                generateFromUI();
            }
        });
    });
}

function addHistory(request, primary, secondary, pattern, detail) {
    const entry = {
        request,
        primary,
        secondary,
        pattern,
        detail,
        timestamp: new Date().toLocaleString('vi-VN')
    };
    history.unshift(entry);
    if (history.length > 100) history = history.slice(0, 100);
    localStorage.setItem('skinHistory', JSON.stringify(history));
    renderHistory();
}

function generateFromUI() {
    const request = document.getElementById('requestInput').value || 'Skin không tên';
    const primary = document.getElementById('colorPrimary').value;
    const secondary = document.getElementById('colorSecondary').value;
    const pattern = document.getElementById('patternSelect').value;
    const detail = document.getElementById('detailSelect').value;
    generateSkin({ primary, secondary, pattern, detail });
    addHistory(request, primary, secondary, pattern, detail);
}

// ============================================================
// SIDEBAR CONTROLS
// ============================================================
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
}
document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
document.getElementById('sidebarClose').addEventListener('click', toggleSidebar);
document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);

function scrollToPanel(id) {
    toggleSidebar();
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetAll() {
    if (confirm('Đặt lại tất cả về mặc định?')) {
        document.getElementById('requestInput').value = 'gradient đỏ-xanh với sọc và chi tiết cao';
        document.getElementById('colorPrimary').value = '#ff2200';
        document.getElementById('colorSecondary').value = '#0044ff';
        document.getElementById('patternSelect').value = 'gradient';
        document.getElementById('detailSelect').value = '2';
        generateFromUI();
        toggleSidebar();
    }
}

function exportAllHistory() {
    if (history.length === 0) { alert('Không có lịch sử để xuất.'); return; }
    const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `skin_history_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toggleSidebar();
}

function importHistory() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (Array.isArray(data)) {
                    history = data;
                    localStorage.setItem('skinHistory', JSON.stringify(history));
                    renderHistory();
                    alert(`Đã nhập ${history.length} mục.`);
                } else { alert('File JSON không hợp lệ.'); }
            } catch(err) { alert('Lỗi đọc file: ' + err.message); }
        };
        reader.readAsText(file);
        toggleSidebar();
    };
    input.click();
}

// ============================================================
// EVENT BINDINGS
// ============================================================
document.getElementById('generateBtn').addEventListener('click', generateFromUI);

document.getElementById('clearCanvasBtn').addEventListener('click', () => {
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 0, W, H);
});

document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    if (confirm('Xóa toàn bộ lịch sử?')) {
        history = [];
        localStorage.removeItem('skinHistory');
        renderHistory();
    }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `skin_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
});

// Zoom
let zoomLevel = 1;
document.getElementById('zoomInBtn').addEventListener('click', () => {
    zoomLevel = Math.min(3, zoomLevel + 0.2);
    canvas.style.transform = `scale(${zoomLevel})`;
    canvas.style.transformOrigin = 'center center';
});
document.getElementById('zoomOutBtn').addEventListener('click', () => {
    zoomLevel = Math.max(0.5, zoomLevel - 0.2);
    canvas.style.transform = `scale(${zoomLevel})`;
    canvas.style.transformOrigin = 'center center';
});

// Enter key in textarea
document.getElementById('requestInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateFromUI();
    }
});

// ============================================================
// INIT
// ============================================================
window.addEventListener('load', () => {
    renderHistory();
    generateFromUI();
});
</script>
</body>
</html>
